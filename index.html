<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rink Scanner</title>

  <!-- App icons (PNG files sit next to this page on GitHub) -->
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Rink Scanner">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Tells your phone to treat this as a standalone native app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem;
    }

    .container { width: 100%; max-width: 440px; margin: auto; }

    header { text-align: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    header p { color: var(--text-muted); font-size: 0.875rem; margin-top: 4px; }

    form, .pin-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    /* Big Camera Button Area */
    .camera-upload-area {
      position: relative;
      border: 2px dashed #475569;
      border-radius: 1rem;
      padding: 2.25rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #0f172a66;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .camera-upload-area:active { border-color: var(--primary); background: #1e293b; }

    .camera-icon {
      width: 64px; height: 64px; fill: none;
      stroke: var(--primary); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
      margin-bottom: 0.75rem;
    }
    .upload-text { font-weight: 600; font-size: 1rem; color: var(--text); }
    .upload-subtext { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    /* Native hidden input that invokes device camera */
    #receiptImage { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

    .preview-container {
      display: none; position: relative; width: 100%; height: 180px;
      border-radius: 0.75rem; overflow: hidden; border: 1px solid var(--border); margin-top: 0.5rem;
    }
    .preview-container img { width: 100%; height: 100%; object-fit: cover; }

    .field-group { display: flex; flex-direction: column; gap: 0.5rem; }

    label {
      font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-muted);
    }

    input[type="text"], input[type="password"], textarea {
      background: #0f172a; border: 1px solid var(--border); border-radius: 0.625rem;
      color: var(--text); padding: 0.75rem 1rem; font-size: 0.95rem; outline: none; width: 100%;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    input:read-only { color: var(--text-muted); cursor: not-allowed; background: #0b1120; }
    textarea { resize: none; height: 70px; }

    .submit-btn {
      background-color: var(--primary); color: #fff; font-size: 1rem; font-weight: 600;
      border: none; border-radius: 0.75rem; padding: 0.9rem; cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35); transition: background-color 0.2s, opacity 0.2s;
    }
    .submit-btn:hover { background-color: var(--primary-hover); }
    .submit-btn:disabled { opacity: 0.6; cursor: wait; }

    .link-btn {
      background: none; border: none; color: var(--text-muted); font-size: 0.8rem;
      text-decoration: underline; cursor: pointer; align-self: center;
    }

    .pin-card { display: none; }
    .pin-card p { color: var(--text-muted); font-size: 0.875rem; line-height: 1.4; }
    .pin-error { color: var(--error); font-size: 0.85rem; display: none; }

    .toast {
      display: none; position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      max-width: calc(100% - 2rem); text-align: center;
      background: var(--success); color: white; padding: 0.75rem 1.5rem; border-radius: 2rem;
      font-weight: 600; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .toast.error { background: var(--error); }

    /* Recent uploads (kept on this phone only) */
    .history-card {
      display: none; margin-top: 1.25rem;
      background-color: var(--card); border: 1px solid var(--border);
      border-radius: 1.25rem; padding: 1.25rem 1.5rem;
    }
    .history-card h2 { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 0.75rem; }
    .history-list { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }
    .history-list li { display: flex; justify-content: space-between; gap: 0.75rem; font-size: 0.875rem; }
    .history-note { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-status { flex-shrink: 0; color: var(--success); font-weight: 600; }
    .history-status.queued { color: #f59e0b; }
    .history-empty { color: var(--text-muted); font-size: 0.875rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Roller Rink Expenses</h1>
      <p>Snap receipts immediately on the go</p>
    </header>

    <!-- PIN setup (shown once per phone) -->
    <div class="pin-card" id="pinCard">
      <p>Enter the rink's PIN to connect this phone. You'll only need to do this once.</p>
      <div class="field-group">
        <label for="pinInput">PIN</label>
        <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" placeholder="6 digits">
      </div>
      <span class="pin-error" id="pinError">That PIN was rejected. Please try again.</span>
      <button type="button" class="submit-btn" id="pinSave">Connect</button>
    </div>

    <form id="expenseForm">
      <!-- Big Camera Trigger -->
      <div class="camera-upload-area">
        <svg class="camera-icon" viewBox="0 0 24 24">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span class="upload-text" id="uploadLabel">Tap to Snap Receipt</span>
        <span class="upload-subtext">Opens device camera</span>
        <!-- capture="environment" forces back camera on phones -->
        <input type="file" id="receiptImage" name="receiptImage" accept="image/*" capture="environment" required>
      </div>

      <div class="preview-container" id="previewWrapper">
        <img id="preview" alt="Receipt preview">
      </div>

      <div class="field-group">
        <label for="timestamp">Timestamp</label>
        <input type="text" id="timestamp" name="timestamp" readonly>
      </div>

      <div class="field-group">
        <label for="quickNote">Quick Note (Optional)</label>
        <textarea id="quickNote" name="quickNote" placeholder="e.g. Concessions soda restock, Skate wheel bearings..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Save Receipt</button>
      <button type="button" class="link-btn" id="changePin">Change PIN</button>
    </form>

    <!-- Recent uploads (kept on this phone only) -->
    <section class="history-card" id="historyCard">
      <h2>Recent uploads on this phone</h2>
      <ul class="history-list" id="historyList"></ul>
      <p class="history-empty" id="historyEmpty">Nothing sent yet.</p>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Make.com webhook for "Oliver – App Intake". This URL is not a secret:
    // Make rejects any upload without the correct PIN, and the PIN is never stored in this file.
    const ENDPOINT = 'https://hook.us2.make.com/euzazwbm3qirwiryjb4uru36tk1j8y9c';
    const PIN_KEY = 'rinkScannerPin';
    const HISTORY_KEY = 'rinkScannerHistory';
    const HISTORY_MAX = 10;    // how many recent uploads to remember
    const MAX_SIDE = 1600;     // longest edge in pixels after resizing
    const JPEG_QUALITY = 0.82;

    const form = document.getElementById('expenseForm');
    const cameraInput = document.getElementById('receiptImage');
    const timestampInput = document.getElementById('timestamp');
    const noteInput = document.getElementById('quickNote');
    const previewWrapper = document.getElementById('previewWrapper');
    const preview = document.getElementById('preview');
    const uploadLabel = document.getElementById('uploadLabel');
    const submitBtn = document.getElementById('submitBtn');
    const toast = document.getElementById('toast');
    const pinCard = document.getElementById('pinCard');
    const pinInput = document.getElementById('pinInput');
    const pinError = document.getElementById('pinError');
    const historyCard = document.getElementById('historyCard');
    const historyList = document.getElementById('historyList');
    const historyEmpty = document.getElementById('historyEmpty');

    // ---------- PIN (kept on this phone only) ----------
    function getPin() { try { return localStorage.getItem(PIN_KEY) || ''; } catch (e) { return memoryPin; } }
    function setPin(v) { memoryPin = v; try { v ? localStorage.setItem(PIN_KEY, v) : localStorage.removeItem(PIN_KEY); } catch (e) {} }
    let memoryPin = '';

    function showPinScreen(rejected) {
      pinError.style.display = rejected ? 'block' : 'none';
      pinInput.value = '';
      form.style.display = 'none';
      historyCard.style.display = 'none';
      pinCard.style.display = 'flex';
      pinInput.focus();
    }
    function showForm() {
      pinCard.style.display = 'none';
      form.style.display = 'flex';
      historyCard.style.display = 'block';
    }
    document.getElementById('pinSave').addEventListener('click', () => {
      const v = pinInput.value.trim();
      if (!v) return;
      setPin(v);
      showForm();
    });
    pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('pinSave').click(); });
    document.getElementById('changePin').addEventListener('click', () => showPinScreen(false));

    // ---------- Recent uploads (kept on this phone only) ----------
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return memoryHistory; }
    }
    let memoryHistory = [];
    function addToHistory(entry) {
      const list = [entry].concat(loadHistory()).slice(0, HISTORY_MAX);
      memoryHistory = list;
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
      renderHistory();
    }
    function renderHistory() {
      const list = loadHistory();
      historyList.innerHTML = '';
      historyEmpty.style.display = list.length ? 'none' : 'block';
      list.forEach((item) => {
        const d = new Date(item.timestamp);
        const li = document.createElement('li');
        const note = document.createElement('span');
        note.className = 'history-note';
        // textContent (not innerHTML) so a note can never inject HTML into the page
        note.textContent = d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
          d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) +
          (item.note ? ' · ' + item.note : '');
        const status = document.createElement('span');
        status.className = 'history-status' + (item.status === 'queued' ? ' queued' : '');
        status.textContent = item.status === 'queued' ? 'Queued' : '✓ Sent';
        li.append(note, status);
        historyList.appendChild(li);
      });
    }

    // ---------- Timestamp ----------
    let capturedAt = new Date();
    function updateTimestamp() {
      capturedAt = new Date();
      timestampInput.value = capturedAt.toLocaleDateString() + ' ' +
        capturedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    // Unambiguous local time with offset, e.g. 2026-10-25T17:31:00-04:00
    function isoLocal(d) {
      const pad = (n) => String(n).padStart(2, '0');
      const off = -d.getTimezoneOffset();
      const sign = off >= 0 ? '+' : '-';
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' +
        pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) +
        sign + pad(Math.floor(Math.abs(off) / 60)) + ':' + pad(Math.abs(off) % 60);
    }

    // ---------- Photo preview + resizing ----------
    cameraInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        previewWrapper.style.display = 'block';
        uploadLabel.textContent = 'Retake Photo';
        updateTimestamp();
      }
    });

    function resizeToBase64(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.naturalWidth * scale);
          canvas.height = Math.round(img.naturalHeight * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY).split(',')[1]);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read the photo')); };
        img.src = url;
      });
    }

    // ---------- Toast ----------
    let toastTimer;
    function showToast(message, isError) {
      toast.textContent = message;
      toast.classList.toggle('error', !!isError);
      toast.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.style.display = 'none'; }, isError ? 5000 : 2500);
    }

    function resetForm() {
      form.reset();
      previewWrapper.style.display = 'none';
      uploadLabel.textContent = 'Tap to Snap Receipt';
      updateTimestamp();
    }

    // ---------- Submit ----------
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = cameraInput.files[0];
      if (!file) { showToast('Snap a receipt first', true); return; }
      const pin = getPin();
      if (!pin) { showPinScreen(false); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Uploading…';

      try {
        const image = await resizeToBase64(file);
        // Form-encoded body keeps this a "simple" request, so no CORS preflight is needed.
        const body = new URLSearchParams({
          pin: pin,
          image: image,
          filename: 'receipt-' + isoLocal(capturedAt).slice(0, 19).replace(/:/g, '-') + '.jpg',
          mimeType: 'image/jpeg',
          timestamp: isoLocal(capturedAt),
          note: noteInput.value.trim()
        });

        const res = await fetch(ENDPOINT, { method: 'POST', body: body });
        const text = await res.text();
        let data = null;
        try { data = JSON.parse(text); } catch (err) {}

        if (res.status === 401) {
          // Wrong PIN: keep the photo, ask for the PIN again.
          setPin('');
          showPinScreen(true);
          showToast('PIN rejected. Your photo is still here.', true);
          return;
        }
        if (res.ok && data && data.ok) {
          addToHistory({ timestamp: isoLocal(capturedAt), note: noteInput.value.trim(), status: 'sent' });
          showToast('✓ Receipt received');
          resetForm();
        } else if (res.ok && text.trim() === 'Accepted') {
          // Make accepted the upload but the scenario is switched off; it will process when turned on.
          addToHistory({ timestamp: isoLocal(capturedAt), note: noteInput.value.trim(), status: 'queued' });
          showToast('✓ Received (queued for processing)');
          resetForm();
        } else {
          throw new Error('Server responded ' + res.status);
        }
      } catch (err) {
        console.error(err);
        showToast('Not saved. Check your connection and tap Save again.', true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Receipt';
      }
    });

    // ---------- Start ----------
    updateTimestamp();
    renderHistory();
    if (getPin()) { showForm(); } else { showPinScreen(false); }
  </script>
</body>
</html>
